name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ "deploy" ]
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare GitHub Pages artifact
        run: |
          # .nojekyll — tell GitHub Pages not to process this as Jekyll site
          touch dist/.nojekyll

          # SPA-aware 404.html — handles client-side routing on GitHub Pages
          cat > dist/404.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>RPGMZ Player</title>
            <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
            <style>
              *{margin:0;padding:0;box-sizing:border-box}
              body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#05070a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
              .container{padding:40px;background:rgba(255,255,255,0.02);border-radius:16px;border:1px solid rgba(255,255,255,0.05)}
              h1{font-size:80px;color:#06b6d4;font-weight:800}
              h2{font-size:24px;margin:16px 0;font-weight:600}
              p{font-size:14px;color:#888;margin-bottom:24px}
              a{color:#06b6d4;text-decoration:none;font-weight:600}
              .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-radius:50%;border-top-color:#06b6d4;animation:spin 1s linear infinite;margin-right:8px;vertical-align:middle}
              @keyframes spin{to{transform:rotate(360deg)}}
            </style>
          </head>
          <body>
            <div class="container">
              <h1>404</h1>
              <h2>Page Not Found</h2>
              <p>The page you're looking for doesn't exist or has been moved.</p>
              <p><a href="/">← Back to Home</a></p>
              <p style="margin-top:24px;font-size:12px;color:#555"><span class="spinner"></span>Redirecting…</p>
            </div>
            <script>
            (function(){
              // SPA fallback: save the attempted path and redirect to root
              // The app can restore it via sessionStorage.redirect
              var path = location.pathname + location.search + location.hash;
              if (path !== '/') {
                sessionStorage.setItem('redirect', path);
                sessionStorage.setItem('redirectTime', Date.now());
              }
              setTimeout(function(){ location.replace('/'); }, 1500);
            })();
            </script>
          </body>
          </html>
          HTMLEOF

          # Optional: CNAME for custom domain (set via repo Variables)
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
          fi

          echo "=== Build output contents ==="
          ls -la dist/
          echo "=== Key files ==="
          ls -la dist/index.html dist/404.html dist/.nojekyll 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
