[package]
name = "rm-wasm-vfs"
version = "1.0.0"
edition = "2021"
description = "WASM Virtual File System for RPG Maker MZ H5 games"
license = "MIT"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"     # optimise for size
lto = true
strip = true
